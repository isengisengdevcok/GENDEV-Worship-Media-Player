name: Build and Release GENDEV Worship Media Player (Windows Tauri)

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional version tag (e.g. v1.0.0). Leave empty to auto-generate v1.0.<run_number>."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    outputs:
      version_tag: ${{ steps.meta.outputs.tag }}
      should_release: ${{ steps.meta.outputs.should_release }}

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v5

      - name: 2. Resolve Version Metadata
        id: meta
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "push" -and "${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } elseif ("${{ inputs.release_tag }}" -ne "") {
            $tag = "${{ inputs.release_tag }}"
          } else {
            $tag = "v1.0.${{ github.run_number }}"
          }
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "should_release=true" >> $env:GITHUB_OUTPUT

      - name: 3. Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: 4. Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: 5. Rust Build Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: 6. Install Dependencies & Verify Frontend
        shell: pwsh
        run: |
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "npm install failed" }
          npm run lint
          if ($LASTEXITCODE -ne 0) { throw "TypeScript lint failed" }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "Frontend build failed" }

      - name: 7. Build Lightweight Tauri v2 Portable & Setup EXEs
        shell: pwsh
        run: |
          npx tauri build --bundles nsis
          if ($LASTEXITCODE -ne 0) { throw "Tauri Windows build failed" }

      - name: 8. Verify Build Artifacts & Package Distribution ZIP + SHA256
        shell: pwsh
        run: |
          if (Test-Path "release_artifacts") { Remove-Item "release_artifacts" -Recurse -Force }
          New-Item -ItemType Directory -Force -Path "release_artifacts" | Out-Null

          $portableSrc = "src-tauri\target\release\gendev-worship-media-player.exe"
          $setupSrc = Get-ChildItem "src-tauri\target\release\bundle\nsis\*-setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1

          if (-not (Test-Path $portableSrc)) { throw "Missing Tauri standalone EXE at $portableSrc" }
          if (-not $setupSrc) { throw "Missing NSIS Setup EXE under src-tauri\target\release\bundle\nsis" }

          $portableDest = "release_artifacts\GENDEV Worship Media Player Portable.exe"
          $setupDest = "release_artifacts\GENDEV Worship Media Player Setup.exe"
          Copy-Item $portableSrc $portableDest -Force
          Copy-Item $setupSrc.FullName $setupDest -Force

          # Prepare Portable ZIP folder layout
          $zipStaging = "dist_zip\GENDEV"
          if (Test-Path $zipStaging) { Remove-Item "dist_zip" -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $zipStaging | Out-Null
          Copy-Item $portableSrc "$zipStaging\GENDEV.exe" -Force
          Copy-Item "README.md" "$zipStaging\README.md" -Force
          foreach ($dir in @("Config","Playlists","MediaLibrary","Cache","Thumbnails","Logs","Backups")) {
            New-Item -ItemType Directory -Force -Path "$zipStaging\$dir" | Out-Null
          }
          Compress-Archive -Path "$zipStaging\*" -DestinationPath "release_artifacts\GENDEV Worship Media Player.zip" -Force

          if (-not (Test-Path "release_artifacts\GENDEV Worship Media Player.zip")) {
            throw "Missing distribution ZIP!"
          }

          $artifactFiles = @(Get-ChildItem "release_artifacts" -File | Sort-Object Name)
          $checksumLines = foreach ($file in $artifactFiles) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($file.Name)"
          }
          $checksumLines | Set-Content -Encoding utf8 -Path "release_artifacts\SHA256SUMS.txt"

          Get-ChildItem "release_artifacts" -File | Format-Table Name, Length

      - name: 9. Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: gendev-windows-dist
          path: release_artifacts/*
          if-no-files-found: error

  release-github:
    needs: build-windows
    if: needs.build-windows.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Download Verified Windows Build Artifacts
        uses: actions/download-artifact@v8
        with:
          name: gendev-windows-dist
          path: release_artifacts

      - name: Verify Downloaded Files Before Release
        run: |
          ls -lh release_artifacts
          test -f "release_artifacts/GENDEV Worship Media Player Portable.exe"
          test -f "release_artifacts/GENDEV Worship Media Player Setup.exe"
          test -f "release_artifacts/GENDEV Worship Media Player.zip"
          test -f "release_artifacts/SHA256SUMS.txt"

      - name: Publish GitHub Release (Idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build-windows.outputs.version_tag }}
        run: |
          {
            echo "## GENDEV Worship Media Player — $TAG"
            echo ""
            echo "Lightweight Tauri v2 (Rust + WebView2) Windows Desktop Edition — exact 1:1 parity with Operator Console Preview."
            echo ""
            echo "### Included Downloads"
            echo "- \`GENDEV Worship Media Player Portable.exe\` — Lightweight standalone portable executable (~5–15 MB)"
            echo "- \`GENDEV Worship Media Player Setup.exe\` — Windows NSIS installer with desktop shortcut"
            echo "- \`GENDEV Worship Media Player.zip\` — Portable directory bundle"
            echo "- \`SHA256SUMS.txt\` — SHA256 verification checksums"
          } > release_notes.md

          assets=(
            "release_artifacts/GENDEV Worship Media Player Portable.exe"
            "release_artifacts/GENDEV Worship Media Player Setup.exe"
            "release_artifacts/GENDEV Worship Media Player.zip"
            "release_artifacts/SHA256SUMS.txt"
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — uploading EXE and ZIP assets."
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" \
              --title "GENDEV Worship Media Player $TAG" \
              --notes-file release_notes.md
          fi
