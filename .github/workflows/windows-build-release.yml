name: Build and Release GENDEV Worship Media Player (Windows)

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional version tag (e.g. v1.0.0). Leave empty to auto-generate v1.0.<run_number>."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    outputs:
      version_tag: ${{ steps.meta.outputs.tag }}
      should_release: ${{ steps.meta.outputs.should_release }}

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v5

      - name: 2. Resolve Version Metadata
        id: meta
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "push" -and "${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } elseif ("${{ inputs.release_tag }}" -ne "") {
            $tag = "${{ inputs.release_tag }}"
          } else {
            $tag = "v1.0.${{ github.run_number }}"
          }
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "should_release=true" >> $env:GITHUB_OUTPUT

      - name: 3. Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 4. Install Python Dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 5. Download and Prepare LibVLC 64-bit Windows Runtime
        shell: pwsh
        run: |
          $vlcVersion = "3.0.21"
          $vlcUrl = "https://download.videolan.org/pub/videolan/vlc/$vlcVersion/win64/vlc-$vlcVersion-win64.zip"
          $zipPath = "$env:TEMP\vlc-win64.zip"
          curl.exe -fSL --retry 3 -o $zipPath $vlcUrl
          if ($LASTEXITCODE -ne 0) { throw "Failed to download LibVLC" }

          $extractDir = "$env:TEMP\vlc-extract"
          if (Test-Path $extractDir) { Remove-Item $extractDir -Recurse -Force }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::ExtractToDirectory($zipPath, $extractDir)

          New-Item -ItemType Directory -Force -Path "vendor\vlc" | Out-Null
          $srcVlc = "$extractDir\vlc-$vlcVersion"
          if (-not (Test-Path "$srcVlc\libvlc.dll")) { throw "libvlc.dll not found in extracted archive" }

          Copy-Item "$srcVlc\libvlc.dll" "vendor\vlc\" -Force
          Copy-Item "$srcVlc\libvlccore.dll" "vendor\vlc\" -Force
          Copy-Item "$srcVlc\plugins" "vendor\vlc\plugins" -Recurse -Force

      - name: 6. Source Code Verification & Unit Tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "."
          python -m compileall -q desktop
          python -m unittest discover -s desktop/tests -t . -p "test_*.py" -v

      - name: 7. Build Portable EXE & Bundle via PyInstaller
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm gendev.spec
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller build failed" }

      - name: 8. Build Windows Installer EXE via Inno Setup
        shell: pwsh
        run: |
          $isccCmd = Get-Command iscc.exe -ErrorAction SilentlyContinue
          $isccPath = if ($isccCmd) { $isccCmd.Source } else { "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $isccPath)) {
            choco install innosetup -y --no-progress
            $isccPath = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $isccPath "installer\gendev_setup.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup build failed" }

      - name: 9. Verify Build Artifacts & Package Distribution ZIP + SHA256
        shell: pwsh
        run: |
          if (Test-Path "release_artifacts") { Remove-Item "release_artifacts" -Recurse -Force }
          New-Item -ItemType Directory -Force -Path "release_artifacts" | Out-Null

          $portable = "dist\GENDEV Worship Media Player Portable.exe"
          $setup = "dist\installer\GENDEV Worship Media Player Setup.exe"
          if (-not (Test-Path $portable)) { throw "Missing $portable" }
          if (-not (Test-Path $setup)) { throw "Missing $setup" }

          Copy-Item $portable "release_artifacts\" -Force
          Copy-Item $setup "release_artifacts\" -Force

          # Prepare Portable ZIP folder layout
          $zipStaging = "dist\zip_staging\GENDEV"
          if (Test-Path $zipStaging) { Remove-Item $zipStaging -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $zipStaging | Out-Null
          Copy-Item $portable "$zipStaging\GENDEV.exe" -Force
          Copy-Item "README.md" "$zipStaging\README.md" -Force
          foreach ($dir in @("Config","Playlists","MediaLibrary","Cache","Thumbnails","Logs","Backups")) {
            New-Item -ItemType Directory -Force -Path "$zipStaging\$dir" | Out-Null
          }
          Compress-Archive -Path "$zipStaging\*" -DestinationPath "release_artifacts\GENDEV Worship Media Player.zip" -Force

          if (-not (Test-Path "release_artifacts\GENDEV Worship Media Player.zip")) {
            throw "Missing distribution ZIP!"
          }

          # Compute SHA256 into a temp list outside release_artifacts so Out-File never locks a scanned file
          $artifactFiles = @(Get-ChildItem "release_artifacts" -File | Sort-Object Name)
          $checksumLines = foreach ($file in $artifactFiles) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($file.Name)"
          }
          $checksumLines | Set-Content -Encoding utf8 -Path "release_artifacts\SHA256SUMS.txt"

          Get-ChildItem "release_artifacts" -File | Format-Table Name, Length

      - name: 10. Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: gendev-windows-dist
          path: release_artifacts/*
          if-no-files-found: error

  release-github:
    needs: build-windows
    if: needs.build-windows.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Download Verified Windows Build Artifacts
        uses: actions/download-artifact@v8
        with:
          name: gendev-windows-dist
          path: release_artifacts

      - name: Verify Downloaded Files Before Release
        run: |
          ls -lh release_artifacts
          test -f "release_artifacts/GENDEV Worship Media Player Portable.exe"
          test -f "release_artifacts/GENDEV Worship Media Player Setup.exe"
          test -f "release_artifacts/GENDEV Worship Media Player.zip"
          test -f "release_artifacts/SHA256SUMS.txt"

      - name: Publish GitHub Release (Idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build-windows.outputs.version_tag }}
        run: |
          {
            echo "## GENDEV Worship Media Player — $TAG"
            echo ""
            echo "Professional Multimedia Control for Worship (Windows 10 / Windows 11 x64)."
            echo ""
            echo "### Included Downloads"
            echo "- \`GENDEV Worship Media Player Portable.exe\` — Single-file portable executable"
            echo "- \`GENDEV Worship Media Player Setup.exe\` — Windows installer with desktop shortcut"
            echo "- \`GENDEV Worship Media Player.zip\` — Portable directory bundle"
            echo "- \`SHA256SUMS.txt\` — SHA256 verification checksums"
          } > release_notes.md

          assets=(
            "release_artifacts/GENDEV Worship Media Player Portable.exe"
            "release_artifacts/GENDEV Worship Media Player Setup.exe"
            "release_artifacts/GENDEV Worship Media Player.zip"
            "release_artifacts/SHA256SUMS.txt"
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — uploading EXE and ZIP assets."
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" \
              --title "GENDEV Worship Media Player $TAG" \
              --notes-file release_notes.md
          fi
