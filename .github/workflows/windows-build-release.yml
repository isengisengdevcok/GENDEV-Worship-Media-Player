name: Build and Release GENDEV Worship Media Player (Windows)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional semantic version tag for manual release (e.g. v1.0.0). Leave empty for build-only."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    outputs:
      version_tag: ${{ steps.meta.outputs.tag }}
      should_release: ${{ steps.meta.outputs.should_release }}

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: 2. Resolve Version Metadata
        id: meta
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "push" -and "${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
            echo "tag=$tag" >> $env:GITHUB_OUTPUT
            echo "should_release=true" >> $env:GITHUB_OUTPUT
          } elseif ("${{ inputs.release_tag }}" -ne "") {
            echo "tag=${{ inputs.release_tag }}" >> $env:GITHUB_OUTPUT
            echo "should_release=true" >> $env:GITHUB_OUTPUT
          } else {
            echo "tag=dev-${{ github.run_number }}" >> $env:GITHUB_OUTPUT
            echo "should_release=false" >> $env:GITHUB_OUTPUT
          }

      - name: 3. Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 4. Install Python Dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 5. Download and Prepare LibVLC 64-bit Windows Runtime
        shell: pwsh
        run: |
          $vlcVersion = "3.0.21"
          $vlcUrl = "https://get.videolan.org/vlc/$vlcVersion/win64/vlc-$vlcVersion-win64.zip"
          $zipPath = "$env:TEMP\vlc-win64.zip"
          Invoke-WebRequest -Uri $vlcUrl -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath "$env:TEMP\vlc-extract" -Force
          New-Item -ItemType Directory -Force -Path "vendor\vlc" | Out-Null
          $srcVlc = "$env:TEMP\vlc-extract\vlc-$vlcVersion"
          Copy-Item "$srcVlc\libvlc.dll" "vendor\vlc\" -Force
          Copy-Item "$srcVlc\libvlccore.dll" "vendor\vlc\" -Force
          Copy-Item "$srcVlc\plugins" "vendor\vlc\plugins" -Recurse -Force

      - name: 6. Source Code Verification & Unit Tests
        shell: pwsh
        run: |
          python -m compileall desktop
          python -m unittest discover -s desktop/tests -p "test_*.py" -v

      - name: 7. Build Portable EXE & Bundle via PyInstaller
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm gendev.spec

      - name: 8. Build Windows Installer EXE via Inno Setup
        shell: pwsh
        run: |
          $isccPath = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $isccPath)) {
            choco install innosetup -y --no-progress
          }
          & $isccPath "installer\gendev_setup.iss"

      - name: 9. Verify Build Artifacts & Package Distribution ZIP + SHA256
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release_artifacts" | Out-Null

          $portable = "dist\GENDEV Worship Media Player Portable.exe"
          $setup = "dist\installer\GENDEV Worship Media Player Setup.exe"
          if (-not (Test-Path $portable)) { throw "Missing $portable" }
          if (-not (Test-Path $setup)) { throw "Missing $setup" }

          Copy-Item $portable "release_artifacts\" -Force
          Copy-Item $setup "release_artifacts\" -Force

          # Prepare Portable ZIP folder layout
          $zipStaging = "dist\zip_staging\GENDEV"
          New-Item -ItemType Directory -Force -Path $zipStaging | Out-Null
          Copy-Item $portable "$zipStaging\GENDEV.exe" -Force
          Copy-Item "README.md" "$zipStaging\README.md" -Force
          foreach ($dir in @("Config","Playlists","MediaLibrary","Cache","Thumbnails","Logs","Backups")) {
            New-Item -ItemType Directory -Force -Path "$zipStaging\$dir" | Out-Null
          }
          Compress-Archive -Path "$zipStaging\*" -DestinationPath "release_artifacts\GENDEV Worship Media Player.zip" -Force

          if (-not (Test-Path "release_artifacts\GENDEV Worship Media Player.zip")) {
            throw "Missing distribution ZIP!"
          }

          # Generate SHA256 Checksums
          Get-ChildItem "release_artifacts\*" -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Out-File -Encoding utf8 "release_artifacts\SHA256SUMS.txt"

          Get-ChildItem "release_artifacts"

      - name: 10. Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gendev-windows-dist
          path: release_artifacts/*
          if-no-files-found: error

  release-github:
    needs: build-windows
    if: needs.build-windows.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Verified Windows Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: gendev-windows-dist
          path: release_artifacts

      - name: Verify Downloaded Files Before Release
        run: |
          ls -lh release_artifacts
          test -f "release_artifacts/GENDEV Worship Media Player Portable.exe"
          test -f "release_artifacts/GENDEV Worship Media Player Setup.exe"
          test -f "release_artifacts/GENDEV Worship Media Player.zip"
          test -f "release_artifacts/SHA256SUMS.txt"

      - name: Publish GitHub Release (Idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build-windows.outputs.version_tag }}
        run: |
          NOTES=$(cat <<'EOF'
          ## GENDEV Worship Media Player — ${{ needs.build-windows.outputs.version_tag }}

          Professional Multimedia Control for Worship (Windows 10 / Windows 11 x64).

          ### Included Downloads
          - `GENDEV Worship Media Player Portable.exe` — Single-file portable executable (no installation required)
          - `GENDEV Worship Media Player Setup.exe` — Windows installer with desktop shortcut
          - `GENDEV Worship Media Player.zip` — Portable directory bundle (`Config/`, `Playlists/`, `MediaLibrary/`, `Cache/`, `Thumbnails/`, `Logs/`, `Backups/`)
          - `SHA256SUMS.txt` — SHA256 verification checksums

          ### Highlights
          - Dual Display / Projector fullscreen output with hot-plug HDMI recovery
          - Smart Fade Out / Fade In, Auto-Fade at End, and Audio Crossfade
          - Black Screen & Freeze Frame (audio continues smoothly)
          - Background Music automation & Custom Media Library scanner
          EOF
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — updating assets without duplicating release."
            gh release upload "$TAG" release_artifacts/* --clobber
          else
            gh release create "$TAG" release_artifacts/* \
              --title "GENDEV Worship Media Player $TAG" \
              --notes "$NOTES"
          fi
