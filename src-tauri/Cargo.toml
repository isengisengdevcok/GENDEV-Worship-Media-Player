[package]
name = "gendev-worship-media-player"
version = "1.0.0"
description = "GENDEV Worship Media Player — Professional Church Video & Audio Presentation Software"
authors = ["GENDEV"]
edition = "2021"

[lib]
name = "gendev_worship_media_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
